---
services:
  app:
    container_name: petropolis-be
    image: petropolis-be
    build:
        context: .
        dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - "3000:3000"
    networks:
      - petropolis
    volumes:
      - 'sqlite:/app/prisma/database'

volumes:
  sqlite:

networks:
  petropolis:
    name: petropolis-network